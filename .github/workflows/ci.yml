name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check .
      - run: python -m black --check .
      - run: python -m mypy src
      - run: python scripts/check_workflows.py

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[dev]"
      - name: Tests with representative coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m pytest -q --cov=desktop_2fa --cov-report=term --cov-report=xml
      - name: Tests
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.11'
        run: python -m pytest -q
      - name: Upload coverage evidence
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build twine
      - run: python scripts/release_checks.py version
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install and check wheel outside checkout
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install dist/*.whl
          cp scripts/smoke_installed.py "$smoke_dir/"
          cp -R tests/fixtures/vaults "$smoke_dir/fixtures"
          cd "$smoke_dir"
          env -u PYTHONPATH "$smoke_dir/venv/bin/python" -I smoke_installed.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  gate:
    name: CI gate
    if: always()
    needs: [quality, tests, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/release_checks.py gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}

  publish:
    name: Publish validated artifacts to PyPI
    needs: [gate, package]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.gate.result == 'success' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - run: python -m pip install twine
      - name: Publish the checked distributions
        run: python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
